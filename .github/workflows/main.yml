name: Pneumonia Detect CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify required files exist
        run: |
          test -f app.py
          test -f requirements.txt
          test -f final_pneumonia_model.keras
          test -f README.md

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Validate application dependencies
        run: |
          python -c "import streamlit; print('Streamlit imported successfully')"
          python -c "import tensorflow as tf; print('TensorFlow imported successfully')"

      - name: Validate model file presence
        run: python -c "import os; assert os.path.exists('final_pneumonia_model.keras'); print('Model file found successfully')"
